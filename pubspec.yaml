name: books
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=3.4.4 <4.0.0"

dependencies:
  animated_bottom_navigation_bar: ^1.3.3
  animated_splash_screen: ^1.3.0
  auto_size_text: ^3.0.0
  bloc: ^8.1.4
  circular_reveal_animation: ^2.0.1
  cupertino_icons: ^1.0.6
  curved_navigation_bar: ^1.0.6
  equatable: ^2.0.5
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  go_router: ^14.2.2
  smooth_page_indicator: ^1.2.0+3
  carousel_slider: ^5.0.0

dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - asset/image/
  fonts:
    - family: Roboto
      fonts:
        - asset: asset/fonts/Roboto-Regular.ttf
        - asset: asset/fonts/Roboto-Bold.ttf
          weight: 700
    - family: Poppins
      fonts:
        - asset: asset/fonts/Poppins-Regular.ttf
        - asset: asset/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: asset/fonts/Poppins-Black.ttf
          weight: 900
        - asset: asset/fonts/Poppins-Italic.ttf
          style: italic
